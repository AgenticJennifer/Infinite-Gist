services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infinite_gist}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infinite_gist_dev}
      POSTGRES_DB: ${POSTGRES_DB:-infinite_gist}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infinite_gist} -d ${POSTGRES_DB:-infinite_gist}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-infinite_gist}:${POSTGRES_PASSWORD:-infinite_gist_dev}@db:5432/${POSTGRES_DB:-infinite_gist}
      SCHEDULER_ENABLED: "true"
      ENABLE_TRUFFLEHOG: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
