name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned: an unpinned ruff means a new release can change the default rule
      # set and red-fail CI on unchanged code. Bump this deliberately.
      # Rule selection lives in ruff.toml at the repo root.
      - run: pip install ruff==0.16.2
      - run: ruff check src/
      - run: ruff format --check src/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: infinite_gist
          POSTGRES_PASSWORD: infinite_gist
          POSTGRES_DB: infinite_gist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U infinite_gist -d infinite_gist"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://infinite_gist:infinite_gist@localhost:5432/infinite_gist
      SECRET_KEY: ci-secret-key
      ENCRYPTION_KEY: ci-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run test:frontend

  # Static type checking with pyright.
  # NOTE: The codebase currently carries ~200 pre-existing pyright errors rooted in
  # SQLAlchemy Column-vs-scalar typing friction (not real bugs). This job is
  # intentionally NON-BLOCKING so it surfaces type regressions in the CI log
  # without red-failing the pipeline. Once the SQLAlchemy-typing baseline is
  # cleaned up, remove `continue-on-error` below to make type regressions a
  # required gate. See pyrightconfig.json for the (lenient) scope/settings.
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: jakebailey/pyright-action@v2
        continue-on-error: true
        with:
          version: latest
