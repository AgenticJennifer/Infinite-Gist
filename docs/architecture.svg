<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="960" height="460" fill="#fcfcfd"/>

  <!-- Core loop strip -->
  <g font-size="12" font-weight="600" fill="#7a7e88" letter-spacing="0.05em">
    <text x="40" y="30">DISCOVER</text>
    <text x="270" y="30">UNDERSTAND</text>
    <text x="520" y="30">ACT</text>
    <text x="730" y="30">VERIFY</text>
  </g>
  <g stroke="#dcdfe4" stroke-width="1">
    <line x1="40" y1="40" x2="900" y2="40"/>
  </g>
  <g fill="#3d6fe0">
    <circle cx="200" cy="40" r="3"/>
    <circle cx="450" cy="40" r="3"/>
    <circle cx="680" cy="40" r="3"/>
  </g>

  <!-- Browser / SPA -->
  <g>
    <rect x="40" y="90" width="180" height="90" rx="8" fill="#f5f6f8" stroke="#dcdfe4"/>
    <text x="60" y="118" font-size="14" font-weight="600" fill="#17181c">Browser</text>
    <text x="60" y="138" font-size="12" fill="#7a7e88">Vanilla JS SPA</text>
    <text x="60" y="155" font-size="12" fill="#7a7e88">hash routing</text>
  </g>

  <!-- Arrow -->
  <path d="M 220 135 L 268 135" stroke="#3d6fe0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- FastAPI -->
  <g>
    <rect x="270" y="90" width="200" height="90" rx="8" fill="#f5f6f8" stroke="#dcdfe4"/>
    <text x="290" y="118" font-size="14" font-weight="600" fill="#17181c">FastAPI</text>
    <text x="290" y="138" font-size="12" fill="#7a7e88">/api/v1 endpoints</text>
    <text x="290" y="155" font-size="12" fill="#7a7e88">auth, gists, findings,</text>
    <text x="290" y="170" font-size="12" fill="#7a7e88">remediation, schedules</text>
  </g>

  <path d="M 470 135 L 518 135" stroke="#3d6fe0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Services layer -->
  <g>
    <rect x="520" y="70" width="220" height="130" rx="8" fill="#e4eafd" stroke="#3d6fe0" stroke-width="1"/>
    <text x="540" y="98" font-size="14" font-weight="600" fill="#17181c">Service Layer</text>
    <text x="540" y="120" font-size="12" fill="#2b2e36">secret_scanner + TruffleHog</text>
    <text x="540" y="138" font-size="12" fill="#2b2e36">severity_scorer, correlator</text>
    <text x="540" y="156" font-size="12" fill="#2b2e36">remediation_service</text>
    <text x="540" y="174" font-size="12" fill="#2b2e36">scheduler, digest, trend</text>
  </g>

  <path d="M 740 135 L 788 135" stroke="#3d6fe0" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DB -->
  <g>
    <rect x="790" y="90" width="130" height="90" rx="8" fill="#f5f6f8" stroke="#dcdfe4"/>
    <text x="810" y="118" font-size="14" font-weight="600" fill="#17181c">Database</text>
    <text x="810" y="138" font-size="12" fill="#7a7e88">SQLite (dev)</text>
    <text x="810" y="155" font-size="12" fill="#7a7e88">PostgreSQL (prod)</text>
  </g>

  <!-- External integrations -->
  <path d="M 370 180 L 370 260" stroke="#dcdfe4" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <g>
    <rect x="270" y="262" width="200" height="70" rx="8" fill="#fcfcfd" stroke="#dcdfe4" stroke-dasharray="4,3"/>
    <text x="290" y="288" font-size="13" font-weight="600" fill="#2b2e36">GitHub OAuth + API</text>
    <text x="290" y="306" font-size="12" fill="#7a7e88">gist enumeration, revisions</text>
  </g>

  <path d="M 620 200 L 620 260" stroke="#dcdfe4" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <g>
    <rect x="520" y="262" width="200" height="70" rx="8" fill="#fcfcfd" stroke="#dcdfe4" stroke-dasharray="4,3"/>
    <text x="540" y="288" font-size="13" font-weight="600" fill="#2b2e36">TruffleHog</text>
    <text x="540" y="306" font-size="12" fill="#7a7e88">subprocess secret scanning</text>
  </g>

  <!-- Findings + remediation callout -->
  <g>
    <rect x="40" y="360" width="880" height="70" rx="8" fill="#f5f6f8" stroke="#dcdfe4"/>
    <text x="60" y="386" font-size="13" font-weight="600" fill="#17181c">Audit trail</text>
    <text x="60" y="405" font-size="12" fill="#7a7e88">Every finding, scan, and remediation action is logged with masked evidence, timestamps, and actor context.</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d6fe0"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a7e88"/>
    </marker>
  </defs>
</svg>
